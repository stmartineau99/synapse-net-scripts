# actin domain adaptation pipeline

[run_info]
data_root = "/projects/extern/nhr/nhr_ni/nim00020/dir.project/sage/data"
synthetic_dataset = "deepict_dataset_1"                                     # simulated dataset
dataset = "deepict"                                                    # target experimental dataset
run = 1

[prepare_training]
n_conditions = 4
n_tomos = 20
# conditions = [0, 1, 2, 3]            # optional; defaults to range(n_conditions)
train_fraction = 0.7
val_fraction = 0.2
test_fraction = 0.1
raw_key = "raw"
label_key = "/labels/actin"

[supervised_training]
# conditions = [0, 1, 2]               # optional; select a subset of conditions for training
label_key = "/labels/actin"
patch_shape = [64, 256, 256]
batch_size = 4
lr = 4e-4
n_iterations = 50_000
# loss_fn = "DiceLoss"                  # optional; defaults to DiceLoss

[unsupervised_domain_adaptation]
# source_checkpoint = "/override/checkpoint/path"
train_glob = "*.h5" #TODO fix this
val_glob = "*.h5"   #TODO fix this
raw_key = "raw"
sample_mask_key = "sample_mask"
patch_shape = [64, 256, 256]
batch_size = 2
lr = 2e-4

[semisupervised_domain_adaptation]
# source_checkpoint = "/override/checkpoint/path"
train_glob = "*.h5" #TODO fix this
val_glob = "*.h5"   #TODO fix this
raw_key = "raw"
sample_mask_key = "sample_mask"
patch_shape = [64, 256, 256]
batch_size = 2
lr = 2e-4
supervised_data_dir = ""               # path to directory with labeled h5 files
supervised_train_glob = "*.h5"
supervised_val_glob = "*.h5"
label_key = "/labels/actin"
raw_key_supervised = "raw"

# One table per job, submitted with: python slurm_scripts/submit.py <config> --job <name>
# Optional per job: env (overrides [jobs].env), slurm = {...} (overrides the profile), args = {...} (flags after --config)
[jobs]
env = "synapse-net"

[jobs.prepare_training]
script = "pipeline_scripts/training/prepare_training.py"
slurm_profile = "cpu_large96s"

[jobs.supervised_training]
script = "pipeline_scripts/training/supervised_training.py"
slurm_profile = "grete_a100_80gb"

[jobs.domain_adaptation]
script = "pipeline_scripts/training/domain_adaptation.py"
slurm_profile = "grete_a100_80gb"
slurm = { cpus = 12, mem = "20G" }

[jobs.predict_actin]
script = "pipeline_scripts/inference/predict_actin.py"
slurm_profile = "grete_interactive"
args = { data_dir = "/projects/extern/nhr/nhr_ni/nim00020/dir.project/sage/data/experimental/deepict/h5/subvolumes/train" }
