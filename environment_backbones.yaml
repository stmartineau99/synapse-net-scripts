# Environment for synapse-net backbones.
# Built on a grete:shared A100-SXM4-40GB (ggpu130), driver 580.178.04, CUDA 13.0.
# torch_em and synapse_net are installed editable from source/ by sbatch_create_env.sh.
# Backbones: sam, dinov3, monai

channels:
    - conda-forge
name:
    synapse-net-backbones
dependencies:
    - python=3.12
    - cuda-version=13.0
    - pytorch
    - torchvision
    - torchmetrics
    - micro_sam
    - segment-anything
    - timm
    - bioimage-cpp
    - bioimageio.spec
    - bioimageio.core >=0.8.0
    - python-elf >=0.9.1
    - kornia
    - imagecodecs
    - natsort
    - tifffile >=2024
    - tensorboard
    - zarr <3
    - numpy
    - scipy
    - scikit-image
    - scikit-learn
    - h5py
    - imageio
    - mrcfile
    - monai
    - pandas
    - pooch
    - trimesh
    - requests
    - tqdm
    - pillow
    - hydra-core
    - iopath
    - omegaconf
    - ftfy
    - regex
    - submitit
    - termcolor
    - configargparse
    - toml
    - pip
